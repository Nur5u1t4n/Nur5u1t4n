    <text x="296" y="158" font-size="51" font-weight="700" letter-spacing="-1.5">Nursultan</text>
    <text x="300" y="197" font-size="18" fill="#B9CEC5" letter-spacing="1">SOFTWARE DEVELOPMENT · DATA ANALYTICS · AUTOMATION</text>
    <text x="300" y="240" font-size="16" fill="#91AAA2">Understand the system. Find the friction. Build something useful.</text>
